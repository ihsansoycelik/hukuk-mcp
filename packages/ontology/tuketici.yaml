        ad: Ön ödemeli konut satışı
        aciklama: Yapılacak konutun ön ödemeyle alınmasında cayma, teminat, teslim ve sözleşmeden dönme.
        tetikleyiciler: [ön ödemeli, konut, müteahhit, inşaat, teslim, cayma, teminat, sözleşmeden dönme, proje]
