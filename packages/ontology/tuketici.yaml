          - "Müteahhit konutu zamanında teslim etmiyor."
          - "Ön ödeme yaptım, proje iptal oldu, paramı alamıyorum."
          - "Sözleşmede teslim tarihi yok, ne yapabilirim?"
          - "Konut tesliminde eksikler var, ödeme yapmalı mıyım?"
